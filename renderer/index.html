<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'"
    />
    <title>Desktop Pet</title>
    <link rel="stylesheet" href="pet.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="bubble" class="bubble" width="1" height="1"></canvas>
      <form id="chat" class="chat hidden" autocomplete="off">
        <input id="chat-input" type="text" maxlength="200" placeholder="Mesaj yaz…" spellcheck="false" />
      </form>
      <canvas id="pet" width="88" height="88"></canvas>
    </div>

    <script src="sprite-animator.js"></script>
    <script src="pixel-text.js"></script>
    <script src="speech-bubble.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
